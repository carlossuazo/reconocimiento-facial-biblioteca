services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: biblioteca_app
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Inside the compose network the app reaches Postgres by service name,
      # not localhost, and on its internal port (5432) — not the host-mapped one.
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "${PORT:-3002}:3000"
    volumes:
      - biblioteca_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  biblioteca_pgdata:
  biblioteca_uploads:
